const SN=`Urutan dasar: kata kerja di akhir|(Waktu) + Subjek は + (Tempat で) + Objek を + Kata kerja|わたしは あした がっこうで にほんごを べんきょうします。|Besok saya belajar bahasa Jepang di sekolah.|Indonesia itu SVO, Jepang SOV: kata kerja SELALU di akhir. Partikel menandai peran tiap kata, jadi urutan kata di tengah agak fleksibel.
Kalimat benda: A adalah B|A は B です / ではありません / でした / ですか|たなかさんは せんせいです。|Pak Tanaka adalah guru.|です = "adalah" (sopan). Negatif: ではありません (lisan: じゃありません). Lampau: でした.
Kata sifat -i|A は adj-i です. Negatif: い→くないです. Lampau: い→かったです|このりんごは おいしいです。|Apel ini enak.|おいしくないです = tidak enak; おいしかったです = dulu enak. Pengecualian: いい → よくないです.
Kata sifat -na|A は adj-na です. Sebelum benda: adj-na + な + benda. Negatif: じゃありません|ここは しずかです。 / しずかな まち|Di sini tenang. / Kota yang tenang.|きれい, すき, げんき termasuk kata sifat -na.
Kata kerja bentuk ます|ます (sekarang/akan) · ません (tidak) · ました (lampau) · ませんでした (tidak, lampau)|まいあさ パンを たべます。|Tiap pagi saya makan roti.|Satu bentuk untuk sekarang & masa depan. Waktunya ditunjukkan kata keterangan seperti あした, まいにち.
Ada: あります / います|Tempat に Benda が あります · Tempat に Orang が います|つくえの うえに ほんが あります。|Di atas meja ada buku.|います untuk makhluk hidup (orang, hewan), あります untuk benda mati & tumbuhan.
Ingin: ~たい|Kata kerja (tanpa ます) + たいです|すしを たべたいです。|Saya ingin makan sushi.|Objek boleh pakai を atau が.
Sedang melakukan: ~ています|Kata kerja bentuk-te + います|いま テレビを みています。|Sekarang sedang nonton TV.|Bentuk-te: たべる→たべて, みる→みて, のむ→のんで, いく→いって, かく→かいて.
Ajakan & permintaan|~ませんか (mau ...?) · ~ましょう (ayo) · ~てください (tolong)|いっしょに たべませんか。|Mau makan bareng?|Tambah おねがいします untuk permintaan yang lebih sopan.
Kalimat tanya|Kalimat biasa + か. Kata tanya menempati posisi jawabannya|これは なんですか。|Ini apa?|Kata tanya tidak dipindah ke depan seperti bahasa Indonesia.`;

const cats=()=>T.p=='koto'?[...new Set(D.koto.map(x=>x.g))]:Object.keys(KG);
const ans=c=>T.rev?c.f:c.b;
function opts(c){const a=ans(c),o=[a],seen=new Set([a]);for(const x of sh(D[T.p])){if(x.b===c.b||seen.has(ans(x)))continue;seen.add(ans(x));o.push(ans(x));if(o.length==4)break}return sh(o)}
function go(p){T.p=p;T.m='list';T.sel=new Set();T.fc=T.qz=null;R();scrollTo(0,0)}
function mode(m){T.m=m;T.fc=T.qz=null;const d=deck();if(m=='card')T.fc={q:sh(d),n:0,t:d.length,fl:0};if(m=='quiz'){const q=sh(d).slice(0,10);T.qz={q,i:0,s:0,pk:null,o:opts(q[0])}}R()}
function ch(g){g==null?T.sel.clear():T.sel.has(g)?T.sel.delete(g):T.sel.add(g);T.m=='list'?R():mode(T.m)}
function rv(){T.rev=!T.rev;mode(T.m)}
function fl(){T.fc.fl^=1;R()}
function ok(y){const f=T.fc;if(y){f.q.shift();f.n++}else f.q.push(f.q.shift());f.fl=0;R()}
function pk(i){const z=T.qz;if(z.pk!=null)return;z.pk=i;if(z.o[i]==ans(z.q[z.i]))z.s++;R()}
function nx(){const z=T.qz;z.i++;z.pk=null;if(z.i<z.q.length)z.o=opts(z.q[z.i]);R()}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function list(){const d=deck();return [...new Set(d.map(x=>x.g))].map(g=>{const it=d.filter(x=>x.g==g);return `<h3>${g}<small>${it.length}</small>${NOTE[g]&&T.p!='koto'?`<em>${NOTE[g]}</em>`:''}</h3>`+(T.p=='koto'?`<div class="card" style="padding:4px">${it.map(x=>`<div class="w"><b>${x.f}</b><span>${x.s}</span><i>${x.b}</i></div>`).join('')}</div>`:`<div class="kg">${it.map(x=>`<div class="k"><b>${x.f}</b><span>${x.b}</span></div>`).join('')}</div>`)}).join('')}
function card(){const f=T.fc;if(!f.q.length)return `<div class="card c" style="margin-top:12px"><div class="big">🎉</div><p>Selesai! ${f.t} kartu sudah hafal.</p><button class="btn" onclick="mode('card')">Ulangi</button></div>`;const c=f.q[0],fr=T.rev?c.b:c.f,bk=T.rev?c.f:c.b;
return `<p class="mut">Hafal ${f.n} / ${f.t}</p><div class="card fc" onclick="fl()"><div class="big">${f.fl?bk:fr}</div>${f.fl&&c.s?`<div class="sub">${c.s}</div>`:''}${f.fl?'':'<div class="sub">ketuk untuk membalik</div>'}<button class="chip" style="margin-top:12px" onclick="event.stopPropagation();say('${c.f}')">🔊 Dengar</button></div>${f.fl?`<div class="row"><button class="btn no" onclick="ok(0)">Belum hafal</button><button class="btn ok" onclick="ok(1)">Hafal</button></div>`:''}`}
function quiz(){const z=T.qz;if(z.i>=z.q.length)return `<div class="card c" style="margin-top:12px"><div class="big">${z.s}/${z.q.length}</div><p>${z.s==z.q.length?'Sempurna! すごい!':z.s>=z.q.length*.7?'Bagus, lanjut terus!':'Ayo latihan lagi, pasti bisa!'}</p><button class="btn" onclick="mode('quiz')">Main lagi</button></div>`;
const c=z.q[z.i],a=ans(c);return `<p class="mut">Soal ${z.i+1}/${z.q.length} · Skor ${z.s}</p><div class="card c"><div class="big">${T.rev?c.b:c.f}</div></div><div class="opts">${z.o.map((o,i)=>`<button class="opt ${z.pk!=null?(o==a?'ok':i==z.pk?'no':''):''}" onclick="pk(${i})">${o}</button>`).join('')}</div>${z.pk!=null?`<button class="btn" style="width:100%" onclick="nx()">Lanjut →</button>`:''}`}
function page(){const t={hira:'ひらがな Hiragana',kata:'カタカナ Katakana',koto:'ことば Kotoba'}[T.p];
const chips=`<div class="chips"><button class="chip ${T.sel.size?'':'on'}" onclick="ch()">Semua</button>${cats().map(c=>`<button class="chip ${T.sel.has(c)?'on':''}" onclick="ch('${c}')">${c}</button>`).join('')}</div>`;
const tabs=[['list',T.p=='koto'?'Daftar':'Tabel'],['card','Flashcard'],['quiz','Quiz']].map(([m,l])=>`<button class="tab ${T.m==m?'on':''}" onclick="mode('${m}')">${l}</button>`).join('');
return `<h1 style="font-size:24px;margin-top:8px">${t}</h1><div class="tabs">${tabs}</div>${chips}${T.m!='list'?`<label class="rv"><input type="checkbox" ${T.rev?'checked':''} onchange="rv()"> Balik arah (${T.p=='koto'?'arti → kata':'romaji → huruf'})</label>`:''}${T.m=='list'?list():T.m=='card'?card():quiz()}`}
function dash(){return `<div style="margin-top:8px"><h1>日本語 道場</h1><p class="mut">Belajar Jepang untuk pemula level N5 & N4: kana, kotoba, partikel, dan pola kalimat. Pilih menu di bawah atau tab di atas.</p></div>
<div class="stats">${[['hira','ひらがな',D.hira.length+' huruf'],['kata','カタカナ',D.kata.length+' huruf'],['koto','ことば',D.koto.length+' kata']].map(([p,n,c])=>`<button class="card st" onclick="go('${p}')"><b>${n}</b><span>${c}</span><i>Tabel · Flashcard · Quiz</i></button>`).join('')}</div>
<h2>Partikel 助詞</h2><p class="mut">Partikel itu "lem" kalimat Jepang: menandai peran kata di depannya.</p><div class="pg">${PT.split('\n').map(l=>{const[p,r,e,j,a]=l.split('|');return `<div class="card"><div class="pc">${p}<small>${r}</small></div><div>${e}</div><div class="ex">${j}<br><span class="mut">${a}</span></div></div>`}).join('')}</div>
<h2>Cara Menyusun Kalimat</h2>${SN.split('\n').map(l=>{const[t,p,j,a,n]=l.split('|');return `<div class="card sn"><b>${t}</b><code>${p}</code><div class="ex">${j}<br><span class="mut">${a}</span></div><p class="mut" style="margin:6px 0 0;font-size:14px">${n}</p></div>`}).join('')}`}
function R(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p==T.p));$('#app').innerHTML=T.p=='dash'?dash():page()}
const TH={sakura:'#e8638b',neon:'#00e5ff',washi:'#b23a2e',pop:'#58cc02'};
function th(t){document.documentElement.dataset.t=t;try{localStorage.setItem('t',t)}catch(e){}}
$('#dots').innerHTML=Object.entries(TH).map(([k,c])=>`<button class="dot" title="${k}" style="background:${c}" onclick="th('${k}')"></button>`).join('');
let t0='';try{t0=localStorage.getItem('t')||''}catch(e){}
th(TH[t0]?t0:matchMedia('(prefers-color-scheme: dark)').matches?'neon':'sakura');
R();
</script>
</body>
</html>
